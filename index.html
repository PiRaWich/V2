<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>ELEMENT LAB</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07090d;color:#e8edf5;font-family:system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#c{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.bar{display:flex;align-items:center;gap:6px;padding:5px;overflow-x:auto;background:#10151d;min-height:42px;box-sizing:border-box;scrollbar-width:thin}
button{flex:0 0 auto;background:#1c2430;color:inherit;border:1px solid #2c3848;border-radius:10px;padding:9px 12px;font-size:14px;white-space:nowrap}
button.on{border-color:#66ccff;background:#243a52}
.chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
input[type=range]{width:80px;flex:0 0 auto}
#fps{font-size:12px;color:#7d8aa0;flex:0 0 auto;min-width:48px}
@media (orientation:landscape){body{flex-direction:column}.bar button{padding:7px 9px;font-size:12px}#top{min-height:40px}#bot{min-height:48px}}
</style>
</head>
<body>
<div class="bar" id="top">
  <button id="pause">⏸ หยุด</button>
  <button id="undo">↶ ย้อน</button>
  <button id="clear">🗑 ล้าง</button>
  <button id="spawn">🧍 ตุ๊กตา</button>
  <span id="fps"></span>
  <button id="grab">✋ จับ</button>
  <input id="brush" type="range" min="1" max="8" value="3">
</div>
<canvas id="c"></canvas>
<div class="bar" id="bot"></div>
<script src="matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
